[project]
name = "agentbase-api"
version = "0.1.0"
description = "FastAPI control plane for AI agent job orchestration."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "gunicorn>=23.0.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "python-jose[cryptography]>=3.5.0",
    "httpx>=0.28.0",
    "boto3>=1.40.0",
    "structlog>=25.4.0",
    "openai>=1.99.0",
    "openai-agents>=0.2.0",
    "composio>=0.8.0",
    "composio-openai-agents>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
    "mypy>=1.17.0",
    "types-python-jose>=3.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
